[project]
name = "better-backend"
version = "0.1.0"
description = "Este backend fue creado por yeinher Algarin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.18.4",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio>=4.14.2",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==25.1.0",
    "bcrypt==3.2.2",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.3.3",
    "dnspython==2.8.0",
    "ecdsa>=0.19.2",
    "email-validator==2.3.0",
    "fastapi==0.135.1",
    "fastapi-cli==0.0.24",
    "fastapi-cloud-cli==0.15.0",
    "fastar==0.8.0",
    "greenlet==3.3.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.7.1",
    "httpx==0.28.1",
    "idna>=3.15",
    "jinja2==3.1.6",
    "mako==1.4.2",
    "markdown-it-py==4.0.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "minio==7.2.20",
    "passlib==1.7.4",
    "pip>=26.2",
    "psycopg2-binary==2.9.11",
    "pyasn1==0.6.4",
    "pycparser==3.0",
    "pycryptodome==3.23.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-extra-types==2.11.0",
    "pydantic-settings==2.14.2",
    "pygments>=2.20.0",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "python-multipart>=0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "rich==14.3.3",
    "rich-toolkit==0.19.7",
    "rignore==0.7.6",
    "rsa==4.9.1",
    "sentry-sdk==2.54.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sqlalchemy==2.0.48",
    "typer==0.24.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3>=2.7.0",
    "uvicorn==0.41.0",
    "uvloop==0.22.1",
    "watchfiles==1.1.1",
    "websockets==16.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# Solo el código de la aplicación. alembic/ (migraciones) y main.py (script de
# saludo) quedan fuera por estar fuera de `app/`. No se omite nada dentro de
# app/: seed*.py, CheckNetwork.py y TestDatabase.py se ejecutan en producción
# (lifespan y /health), ver docs/INFORME_PRUEBAS.md.
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
# Gate de CI (ratchet: solo sube). Con branch = true este porcentaje es el
# COMBINADO líneas+ramas de coverage.py, no el de líneas. Línea base 2026-11-03:
# combinado 60,29 % (líneas 65,91 %, ramas 28,62 %).
fail_under = 60

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Gate inicial: solo errores que fallan en runtime (sintaxis, comparaciones
# inválidas, return/yield fuera de función, nombres no definidos). La deuda de
# estilo (imports sin usar, etc.) se sube por escalones, ver docs/pruebas/.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Mapped["Cart"], relationship("Order"): referencias adelantadas en strings que
# resuelve el registry de SQLAlchemy al configurar los mappers, no Python.
"app/models/*" = ["F821"]
