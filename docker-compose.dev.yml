services:
  minio:
    image: minio/minio:latest

    container_name: rehni-minio

    restart: always

    env_file:
      - ./RehniMarket-backend/.env.dev

    ports:
      - "9000:9000"

    volumes:
      - minio_rehni_data:/data

    command: server /data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine

    container_name: rehni-postgres

    restart: always

    env_file:
      - ./RehniMarket-backend/.env.dev

    ports:
      - "5434:5432"

    volumes:
      - postgres_rehni_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./RehniMarket-backend
      dockerfile: Dockerfile

    container_name: rehni-backend

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "8001:8000"

    volumes:
      - ./RehniMarket-backend:/app
      - backend_venv:/app/.venv

    depends_on:
      - postgres
      - minio

    env_file:
      - ./RehniMarket-backend/.env.dev

    restart: always

    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/database', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./RehniMarket-frontend
      dockerfile: Dockerfile.dev

    container_name: rehni-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./RehniMarket-frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    stdin_open: true
    tty: true

    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0 --port 5173"

volumes:
  postgres_rehni_data:
  minio_rehni_data:
  frontend_node_modules:
  backend_venv:
