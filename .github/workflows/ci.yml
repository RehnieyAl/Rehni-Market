name: CI

# Pruebas automáticas en cada push y PR (T7-9 · bc-testing-adso S9), incluidos los PR de Dependabot: corren
# con el GITHUB_TOKEN de solo lectura y sin secretos (pull_request, nunca pull_request_target).
# El análisis estático va aparte en sonarqube.yml. El despliegue (rehnimarket-deploy.yml) espera a que este
# workflow termine bien sobre el commit final de main.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # Nombre = check obligatorio en el ruleset de main: no cambiarlo sin actualizarlo allí.
    # Pasos: lint (ruff), migraciones (alembic), pytest + cobertura.
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: RehniMarket-backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rehni_test
          POSTGRES_PASSWORD: rehni_test
          # BD donde se aplican las migraciones; conftest.py crea y recrea aparte
          # la BD de pruebas indicada en TEST_DATABASE_URL.
          POSTGRES_DB: rehnimarket_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehni_test -d rehnimarket_migrations"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Valores exclusivos de CI: app/Config.py los lee al importarse.
    # No son secretos (no hay SMTP ni MinIO reales: conftest.py los sustituye).
    env:
      URL_DATABASE: postgresql://rehni_test:rehni_test@localhost:5432/rehnimarket_migrations
      TEST_DATABASE_URL: postgresql://rehni_test:rehni_test@localhost:5432/rehnimarket_test
      SECRET_KEY: ci-only-not-a-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "7"
      URL_FRONTEND: http://localhost:5173
      URL_BACKEND: http://localhost:8001
      MINIO_URL: 127.0.0.1:1
      MINIO_ROOT_USER: ci
      MINIO_ROOT_PASSWORD: ci-password
      RUN_SEED: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Misma versión que RehniMarket-backend/Dockerfile (python:3.13-slim).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: RehniMarket-backend/uv.lock

      # --no-build: solo wheels, sin ejecutar scripts de instalación de paquetes (Sonar S8541).
      - name: Instalar dependencias
        run: uv sync --group dev --frozen --no-build

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Migraciones (alembic upgrade head)
        run: uv run --no-sync alembic upgrade head

      # Deriva modelo ↔ migraciones: falla si los modelos piden un cambio que ninguna migración hace.
      - name: Migraciones (alembic check)
        run: uv run --no-sync alembic check

      # El umbral (fail_under) vive en [tool.coverage.report] de pyproject.toml,
      # así local y CI aplican el mismo gate.
      - name: Pruebas con cobertura
        run: >-
          uv run --no-sync pytest
          --cov
          --cov-report=term-missing
          --cov-report=json
          --cov-report=xml
          --cov-report=html

      - name: Subir reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-backend
          path: |
            RehniMarket-backend/htmlcov/
            RehniMarket-backend/coverage.json
            RehniMarket-backend/coverage.xml
          if-no-files-found: warn

  frontend:
    # Nombre = check obligatorio en el ruleset de main: no cambiarlo sin actualizarlo allí.
    # Pasos: lint (eslint), typecheck (tsc), vitest + cobertura.
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: RehniMarket-frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Mismas versiones que RehniMarket-frontend/Dockerfile.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: RehniMarket-frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # --max-warnings 0: cualquier aviso nuevo de ESLint hace fallar el CI.
      - name: Lint (eslint)
        run: pnpm lint:ci

      - name: Typecheck (tsc --noEmit, incluye tests)
        run: pnpm typecheck

      # Umbrales en coverage.thresholds de vitest.config.ts.
      - name: Pruebas con cobertura
        run: pnpm test:coverage

      # El mismo build que hace el Dockerfile: un PR de dependencias que rompe Vite falla aquí y no en el deploy.
      - name: Build de producción
        run: pnpm build

      - name: Subir reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-frontend
          path: RehniMarket-frontend/coverage/
          if-no-files-found: warn

  auditoria:
    # Falla si una dependencia tiene una vulnerabilidad conocida: en Python, cualquiera (pip-audit
    # no filtra por severidad); en el frontend, altas o críticas de lo que llega a producción.
    # Excepciones con motivo y fecha de revisión en .github/auditoria-excepciones.txt.
    name: auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.15.0

      - name: Excepciones vigentes
        id: excepciones
        run: |
          lista=.github/auditoria-excepciones.txt
          hoy=$(date -u +%F)
          vencidas=$(grep -vE '^\s*(#|$)' "$lista" | awk -F'|' -v hoy="$hoy" '{gsub(/ /, "", $1); gsub(/ /, "", $5); if ($5 < hoy) print $1}')
          if [ -n "$vencidas" ]; then
            echo "::error::Excepciones con la fecha de revisión vencida: $vencidas"
            exit 1
          fi
          ids=$(grep -vE '^\s*(#|$)' "$lista" | cut -d'|' -f1 | tr -d ' ')
          echo "pip=$(for id in $ids; do printf -- '--ignore-vuln %s ' "$id"; done)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(for id in $ids; do printf -- '--ignore %s ' "$id"; done)" >> "$GITHUB_OUTPUT"

      # uv.lock completo (producción y desarrollo), con hashes y sin resolver nada nuevo.
      - name: Backend (pip-audit sobre uv.lock)
        working-directory: RehniMarket-backend
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip ${{ steps.excepciones.outputs.pip }}

      # Solo lee pnpm-lock.yaml: no hace falta instalar.
      - name: Frontend (pnpm audit --prod, altas y críticas)
        working-directory: RehniMarket-frontend
        run: pnpm audit --prod --audit-level=high ${{ steps.excepciones.outputs.pnpm }}

  mobile:
    # La app móvil también recibe PR de Dependabot: instalación reproducible, tipos y lint.
    # Aún no tiene pruebas automáticas en main; cuando lleguen, se añade su paso aquí.
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: RehniMarket-mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: RehniMarket-mobile/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      - name: Lint (expo lint)
        run: pnpm lint

  dependencias:
    # Revisa lo que cambia el PR en manifiestos y lockfiles: falla con vulnerabilidades altas o críticas nuevas
    # y con licencias incompatibles. Solo en PR (compara la base con la cabeza). Requiere el Dependency Graph.
    name: dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  rama-origen:
    # A main solo se llega desde develop (flujo normal) o desde hotfix/* (procedimiento excepcional de
    # docs/devops/dependabot-y-seguridad.md). Así un PR de seguridad de Dependabot, que GitHub abre contra main,
    # no se fusiona sin pasar por develop. En PR hacia otras ramas el job pasa sin más.
    name: rama-origen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validar la rama de origen
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "PR hacia $BASE: sin restricción de origen."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Un PR hacia main debe salir de este repositorio, no de $HEAD_REPO."
            exit 1
          fi
          case "$HEAD" in
            develop|hotfix/*) echo "Origen permitido hacia main: $HEAD" ;;
            *)
              echo "::error::Hacia main solo se fusiona develop o hotfix/*; $HEAD debe ir primero a develop."
              exit 1
              ;;
          esac
