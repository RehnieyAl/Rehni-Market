name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migraciones, pytest + cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: RehniMarket-backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rehni_test
          POSTGRES_PASSWORD: rehni_test
          # BD donde se aplican las migraciones; conftest.py crea y recrea aparte
          # la BD de pruebas indicada en TEST_DATABASE_URL.
          POSTGRES_DB: rehnimarket_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehni_test -d rehnimarket_migrations"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Valores exclusivos de CI: app/Config.py los lee al importarse.
    # No son secretos (no hay SMTP ni MinIO reales: conftest.py los sustituye).
    env:
      URL_DATABASE: postgresql://rehni_test:rehni_test@localhost:5432/rehnimarket_migrations
      TEST_DATABASE_URL: postgresql://rehni_test:rehni_test@localhost:5432/rehnimarket_test
      SECRET_KEY: ci-only-not-a-secret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "7"
      URL_FRONTEND: http://localhost:5173
      URL_BACKEND: http://localhost:8001
      MINIO_URL: 127.0.0.1:1
      MINIO_ROOT_USER: ci
      MINIO_ROOT_PASSWORD: ci-password
      RUN_SEED: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      # Misma versión que RehniMarket-backend/Dockerfile (python:3.13-slim).
      # setup-uv no publica tags mayores flotantes (v10 no existe): versión completa.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: RehniMarket-backend/uv.lock

      - name: Instalar dependencias
        run: uv sync --group dev --frozen

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Migraciones (alembic upgrade head)
        run: uv run --no-sync alembic upgrade head

      # El umbral (fail_under) vive en [tool.coverage.report] de pyproject.toml,
      # así local y CI aplican el mismo gate.
      - name: Pruebas con cobertura
        run: >-
          uv run --no-sync pytest
          --cov
          --cov-report=term-missing
          --cov-report=json
          --cov-report=xml
          --cov-report=html

      - name: Subir reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: |
            RehniMarket-backend/htmlcov/
            RehniMarket-backend/coverage.json
            RehniMarket-backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, typecheck, vitest + cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: RehniMarket-frontend

    steps:
      - uses: actions/checkout@v7

      # Mismas versiones que RehniMarket-frontend/Dockerfile.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: RehniMarket-frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # --max-warnings 11: ratchet sobre los warnings actuales (todos react-hooks/exhaustive-deps).
      - name: Lint (eslint)
        run: pnpm lint:ci

      - name: Typecheck (tsc --noEmit, incluye tests)
        run: pnpm typecheck

      # Umbrales en coverage.thresholds de vitest.config.ts.
      - name: Pruebas con cobertura
        run: pnpm test:coverage

      - name: Subir reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: RehniMarket-frontend/coverage/
          if-no-files-found: warn
