# Compose único: desarrollo, pruebas y producción. Lo que cambia entre entornos va en
# el .env de la raíz (.env.example para local, deploy/env.prod.example para el servidor).
#
#   docker compose up -d --build                                  # stack completo
#   docker compose watch                                          # desarrollo (develop.watch)
#   docker compose --profile test up -d --wait postgres-test      # Postgres de pytest
#
# Caddy (servicio `frontend`) es el único punto de entrada: HTTPS en HTTP_PORT/HTTPS_PORT
# (caddy/Caddyfile). Postgres solo se publica en 127.0.0.1 (DbSchema / túnel SSH).

services:
  minio:
    # minio/minio ya no se puede descargar de Docker Hub ("pull access denied … repository
    # does not exist", comprobado el 04/11/2026; quay.io/minio/minio tampoco). Imagen de
    # Chainguard (construida desde el código de MinIO, AGPLv3), fijada por digest:
    # MinIO RELEASE.2026-10-23T20-06-51Z. Corre como uid 65532 (nonroot) y no trae curl:
    # el healthcheck usa mc. Un volumen minio_data creado por la imagen anterior (root)
    # necesita una vez: docker run --rm -v rehni-market_minio_data:/data alpine chown -R 65532:65532 /data
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    container_name: rehni-minio
    restart: unless-stopped
    env_file:
      - ./.env.minio
    volumes:
      - minio_data:/data
    command: server /data
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@localhost:9000 mc ready local >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  postgres:
    image: postgres:17-alpine
    container_name: rehni-postgres
    restart: unless-stopped
    env_file:
      - ./.env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Solo en el loopback del host (clientes como DbSchema; en el servidor, por túnel SSH).
    # Nunca 0.0.0.0: la base de datos no debe quedar expuesta en la red.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    shm_size: 256mb
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - idle_in_transaction_session_timeout=60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "3"
    depends_on:
      minio:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_pool
    restart: unless-stopped
    env_file:
      - ./.env.postgres
    environment:
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      LISTEN_BACKLOG: "4096"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "40"
      MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-1200}"
      QUERY_WAIT_TIMEOUT: "30"
      IDLE_TRANSACTION_TIMEOUT: "60"
      SERVER_IDLE_TIMEOUT: "300"
      SERVER_CONNECT_TIMEOUT: "5"
      SERVER_LOGIN_RETRY: "2"
      TCP_KEEPALIVE: "1"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      STATS_PERIOD: "30"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    entrypoint:
      - sh
      - -c
      - |
        export DATABASE_URL="postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          # PgBouncer usa un único hilo: con 0.5 CPU se vuelve el cuello de botella.
          cpus: "1"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./RehniMarket-backend
      dockerfile: Dockerfile
    image: rehni-market-backend
    container_name: rehni-backend
    restart: unless-stopped
    # Recordar DevOps, Nunca fijar un dns, ya que rompe la resolución de nombres en redes que bloquean DNS saliente a resolutores públicos 
    # (p. ej. Wi-Fi institucional) y `uv run` no puede descargar de PyPI.
    # Tambien bloquea el servicio STMP para enviar correos, por lo que se recomienda usar un relay SMTP interno.
    env_file:
      - ./RehniMarket-backend/.env
      - ./.env.minio
    volumes:
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      UVICORN_WORKERS: "${UVICORN_WORKERS:-3}"
      # Solo Caddy (IP fija de abajo) puede fijar la IP del cliente con X-Forwarded-For.
      # Un rango como 172.16.0.0/12 incluiría la pasarela de Docker (172.30.0.1), por
      # la que llega todo lo que entra al :8000 desde el propio host: cualquiera en el
      # servidor podría falsear su IP y saltarse el rate limit.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-172.30.0.10}"
      DOCS_ENABLED: "${DOCS_ENABLED:-false}"
      # El frontend está en otro dominio que la API: su origen debe estar permitido.
      CORS_EXTRA_ORIGINS: "${CORS_EXTRA_ORIGINS:-}"
      PGBOUNCER_MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-1200}"
    command: sh -c "uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $$UVICORN_WORKERS --backlog 4096 --proxy-headers --forwarded-allow-ips \"$$FORWARDED_ALLOW_IPS\""
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/database', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "4"
    # docker compose watch: el código se copia al contenedor y se reinicia (vuelve a
    # pasar por alembic upgrade head). Sin uvicorn --reload: no se combina con --workers.
    develop:
      watch:
        - action: sync+restart
          path: ./RehniMarket-backend/app
          target: /app/app
        - action: sync+restart
          path: ./RehniMarket-backend/alembic
          target: /app/alembic
        - action: rebuild
          path: ./RehniMarket-backend/pyproject.toml
        - action: rebuild
          path: ./RehniMarket-backend/uv.lock

  frontend:
    build:
      context: ./RehniMarket-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.localhost}
        VITE_REHNIMARKET_WHATSAPP: ${VITE_REHNIMARKET_WHATSAPP:-}
    image: rehni-market-frontend
    container_name: rehni-frontend
    restart: unless-stopped
    # Caddy: sirve el build de React en SITE_ADDRESS y hace de reverse proxy de la API
    # en API_ADDRESS, los dos con HTTPS automático (caddy/Caddyfile).
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-localhost}"
      API_ADDRESS: "${API_ADDRESS:-api.localhost}"
      HTTP_PORT: "${HTTP_PORT:-80}"
      HTTPS_PORT: "${HTTPS_PORT:-443}"
      # Opcional: "local_certs" fuerza la CA local también con nombres que no son
      # localhost (prueba de la semana 3 con rehnimarket / api.rehnimarket).
      CADDY_LOCAL_CERTS: "${CADDY_LOCAL_CERTS:-}"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    # IP fija: el backend confía en X-Forwarded-For solo si viene de aquí (FORWARDED_ALLOW_IPS).
    networks:
      default:
        ipv4_address: 172.30.0.10
    # Mismo puerto dentro y fuera: la redirección HTTP → HTTPS de Caddy apunta a HTTPS_PORT.
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    # docker compose watch: el frontend es un build estático, cada cambio reconstruye
    # la imagen (sin HMR). Para HMR: pnpm dev en el host (http://localhost:5173).
    develop:
      watch:
        - action: rebuild
          path: ./RehniMarket-frontend/src
        - action: rebuild
          path: ./RehniMarket-frontend/public
        - action: rebuild
          path: ./RehniMarket-frontend/index.html
        - action: rebuild
          path: ./RehniMarket-frontend/vite.config.ts
        - action: rebuild
          path: ./RehniMarket-frontend/package.json
        - action: rebuild
          path: ./RehniMarket-frontend/pnpm-lock.yaml
        - action: restart
          path: ./caddy/Caddyfile

  # Postgres desechable para pytest (solo con --profile test). Datos en tmpfs: cada
  # arranque empieza de cero y nada toca la BD de desarrollo.
  #   docker compose --profile test up -d --wait postgres-test
  #   TEST_DATABASE_URL=postgresql://rehni_test:rehni_test@127.0.0.1:55433/rehnimarket_test
  #   docker compose --profile test rm -sf postgres-test
  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rehni_test
      POSTGRES_PASSWORD: rehni_test
      POSTGRES_DB: rehnimarket_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehni_test -d rehnimarket_test"]
      interval: 2s
      timeout: 3s
      retries: 15

# Subred fija para poder dar a Caddy una IP conocida (servicio frontend).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
  minio_data:
  backend_venv:
  caddy_data:
  caddy_config:
