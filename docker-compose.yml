services:
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: rehni-minio
    restart: unless-stopped
    env_file:
      - ./.env.minio
    volumes:
      - minio_data:/data
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  postgres:
    image: postgres:17-alpine
    container_name: rehni-postgres
    restart: unless-stopped
    env_file:
      - ./.env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - idle_in_transaction_session_timeout=60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "3"
    depends_on:
      minio:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_pool
    restart: unless-stopped
    env_file:
      - ./.env.postgres
    environment:
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      LISTEN_BACKLOG: "4096"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "40"
      MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-1200}"
      QUERY_WAIT_TIMEOUT: "30"
      IDLE_TRANSACTION_TIMEOUT: "60"
      SERVER_IDLE_TIMEOUT: "300"
      SERVER_CONNECT_TIMEOUT: "5"
      SERVER_LOGIN_RETRY: "2"
      TCP_KEEPALIVE: "1"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      STATS_PERIOD: "30"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    entrypoint:
      - sh
      - -c
      - |
        export DATABASE_URL="postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          # PgBouncer usa un único hilo: con 0.5 CPU se vuelve el cuello de botella.
          cpus: "1"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./RehniMarket-backend
      dockerfile: Dockerfile
    image: rehni-market-backend
    container_name: rehni-backend
    restart: unless-stopped
    # Recordar DevOps, Nunca fijar un dns, ya que rompe la resolución de nombres en redes que bloquean DNS saliente a resolutores públicos 
    # (p. ej. Wi-Fi institucional) y `uv run` no puede descargar de PyPI.
    # Tambien bloquea el servicio STMP para enviar correos, por lo que se recomienda usar un relay SMTP interno.
    env_file:
      - ./RehniMarket-backend/.env
      - ./.env.minio
    volumes:
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      UVICORN_WORKERS: "${UVICORN_WORKERS:-3}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-172.16.0.0/12}"
      DOCS_ENABLED: "${DOCS_ENABLED:-false}"
      # El frontend está en otro dominio que la API: su origen debe estar permitido.
      CORS_EXTRA_ORIGINS: "${CORS_EXTRA_ORIGINS:-}"
      PGBOUNCER_MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-1200}"
    command: sh -c "uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $$UVICORN_WORKERS --backlog 4096 --proxy-headers --forwarded-allow-ips \"$$FORWARDED_ALLOW_IPS\""
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/database', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "4"

  frontend:
    build:
      context: ./RehniMarket-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_REHNIMARKET_WHATSAPP: ${VITE_REHNIMARKET_WHATSAPP:-}
    image: rehni-market-frontend
    container_name: rehni-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Caddy: sirve el frontend y hace de reverse proxy de la API en su propio dominio
    # (caddy/Caddyfile)

    # minio: sirve los archivos estáticos de la API (archivos subidos por los usuarios) en su propio dominio
      minio:
        condition: service_healthy
      

    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-rehnimarket}"
      API_ADDRESS: "${API_ADDRESS:-api.rehnimarket}"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
volumes:
  postgres_data:
  minio_data:
  backend_venv:
  caddy_data:
  caddy_config:
