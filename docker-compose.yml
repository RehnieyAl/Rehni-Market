services:
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: rehni-minio
    restart: unless-stopped
    env_file:
      - ./RehniMarket-backend/.env
    volumes:
      - minio_data:/data
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    container_name: rehni-postgres
    restart: unless-stopped
    env_file:
      - ./RehniMarket-backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_pool
    restart: unless-stopped
    env_file:
      - ./RehniMarket-backend/.env
    volumes:
      - ./RehniMarket-backend/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./RehniMarket-backend/userlist.txt:/etc/pgbouncer/userlist.txt
    ports:
      - "6432:6432"
    environment:
      - DB_USER=${DB_USER:-mi_usuario}
      - DB_PASS=${DB_PASS:-mi_password}
      - DB_NAME=${DB_NAME:-mi_base_de_datos}
      - DB_HOST=${DB_HOST:-postgres}
      - POOL_MODE=transaction        # CRÍTICO: Reutiliza conexiones por cada transacción SQL
      - MAX_CLIENT_CONN=12000        # CRÍTICO: Permite que entren los 10,000 usuarios de k6
      - DEFAULT_POOL_SIZE=100        # Conexiones reales máximas hacia Postgres
    ulimits:                         # Abre los sockets dentro del contenedor
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - postgres

  backend:
    build:
      context: ./RehniMarket-backend
      dockerfile: Dockerfile
    image: rehni-market-backend
    container_name: rehni-backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./RehniMarket-backend/.env
    environment:
      RATE_LIMIT_ENABLED: "false"
    volumes:
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/database', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./RehniMarket-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_REHNIMARKET_WHATSAPP: ${VITE_REHNIMARKET_WHATSAPP:-}
    image: rehni-market-frontend
    container_name: rehni-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  minio_data:
  backend_venv:
