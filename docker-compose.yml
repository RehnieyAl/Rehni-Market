services:
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: rehni-minio
    restart: unless-stopped
    env_file:
      - ./RehniMarket-backend/.env
    volumes:
      - minio_data:/data
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  postgres:
    image: postgres:17-alpine
    container_name: rehni-postgres
    restart: unless-stopped
    env_file:
      - ./RehniMarket-backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "3"
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_pool
    restart: unless-stopped
    env_file:
      - ./RehniMarket-backend/.env
    environment:
      AUTH_TYPE: scram-sha-256   
      POOL_MODE: transaction     
                                 
      LISTEN_PORT: "6432"        
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      MAX_CLIENT_CONN: "200"
    ulimits:                         
      nofile:
        soft: 65535
        hard: 65535
    entrypoint:
      - sh
      - -c
      - |
        export DATABASE_URL="postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./RehniMarket-backend
      dockerfile: Dockerfile
    image: rehni-market-backend
    container_name: rehni-backend
    restart: unless-stopped
    # Recordar DevOps, Nunca fijar un dns, ya que rompe la resolución de nombres en redes que bloquean DNS saliente a resolutores públicos 
    # (p. ej. Wi-Fi institucional) y `uv run` no puede descargar de PyPI.
    # Tambien bloquea el servicio STMP para 
    env_file:
      - ./RehniMarket-backend/.env
    volumes:
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/database', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "4"

  frontend:
    build:
      context: ./RehniMarket-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_REHNIMARKET_WHATSAPP: ${VITE_REHNIMARKET_WHATSAPP:-}
    image: rehni-market-frontend
    container_name: rehni-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
volumes:
  postgres_data:
  minio_data:
  backend_venv:
