services:
  minio:
    image: minio/minio:latest

    container_name: rehni-minio

    restart: always

    env_file:
      - ./RehniMarket-backend/.env

    ports:
      - "9000:9000"
    
    volumes:
      - minio_rehni_data:/data

    command: server /data

  postgres:
    image: postgres:17-alpine

    container_name: rehni-postgres

    restart: always

    env_file:
      - ./RehniMarket-backend/.env

    ports:
      - "5434:5432"

    volumes:
      - postgres_rehni_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./RehniMarket-backend
      dockerfile: Dockerfile
      
    container_name: rehni-backend
 
    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "8001:8000"

    volumes:
      - ./RehniMarket-backend:/app

    depends_on:
      - postgres
      - minio

    env_file:
      - ./RehniMarket-backend/.env

    restart: always

    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./RehniMarket-frontend
    
    container_name: rehni-frontend
    
    ports:
      - "5173:5173"
    
    volumes:
      - ./RehniMarket-frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    stdin_open: true
    tty: true
    
    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0 --port 5173"

volumes:
  postgres_rehni_data:
  minio_rehni_data:
  frontend_node_modules:

