sonar.projectKey=RehnieyAl_Rehni-Market
sonar.organization=rehnieyal

sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Código fuente: todo el monorepo menos dependencias, artefactos de build,
# código generado, documentación y tests
sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.ruff_cache/**,**/.pytest_cache/**,\
  **/dist/**,**/build/**,**/.expo/**,**/coverage/**,**/htmlcov/**,\
  **/*.min.js,**/*.min.css,\
  RehniMarket-mobile/android/**,RehniMarket-mobile/ios/**,\
  RehniMarket-backend/alembic/versions/**,\
  docs/**,\
  RehniMarket-backend/tests/**,tests/**,RehniMarket-frontend/src/test/**,\
  **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Tests: se indexan como test (no se ejecutan en el CI)
sonar.tests=.
sonar.test.inclusions=\
  RehniMarket-backend/tests/**,tests/**,RehniMarket-frontend/src/test/**,\
  **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.test.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/coverage/**

# Sonar solo para calidad de código: sin métricas de cobertura
sonar.coverage.exclusions=**
