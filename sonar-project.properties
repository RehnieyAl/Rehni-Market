sonar.projectKey=RehnieyAl_Rehni-Market
sonar.organization=rehnieyal

sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Código fuente: todo el monorepo menos dependencias, artefactos de build,
# código generado, documentación y tests
sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.ruff_cache/**,**/.pytest_cache/**,\
  **/dist/**,**/build/**,**/.expo/**,**/coverage/**,**/htmlcov/**,\
  **/*.min.js,**/*.min.css,\
  **/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.ico,**/*.svg,\
  RehniMarket-mobile/android/**,RehniMarket-mobile/ios/**,\
  RehniMarket-backend/alembic/versions/**,\
  docs/**,\
  RehniMarket-backend/tests/**,tests/**,RehniMarket-frontend/src/test/**,\
  **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Tests: se indexan como test; los ejecuta sonarqube.yml antes del análisis
sonar.tests=.
sonar.test.inclusions=\
  RehniMarket-backend/tests/**,tests/**,RehniMarket-frontend/src/test/**,\
  **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.test.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/coverage/**

# Cobertura que generan pytest y Vitest en sonarqube.yml antes del análisis
sonar.python.coverage.reportPaths=RehniMarket-backend/coverage.xml
sonar.javascript.lcov.reportPaths=RehniMarket-frontend/coverage/lcov.info
# La app móvil no publica cobertura: se excluye para no contarla como 0 %
sonar.coverage.exclusions=RehniMarket-mobile/**
