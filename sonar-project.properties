# Identificación del proyecto en SonarCloud
sonar.projectKey=RehnieyAl_Rehni-Market
sonar.organization=RehnieyAl-Comp

sonar.sourceEncoding=UTF-8

# Analiza todo el repo (backend, frontend, mobile, Dockerfiles, compose, workflows)
sonar.sources=.

# Lo que NO se analiza: dependencias, builds, cachés, migraciones generadas y tests
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/.ruff_cache/**,\
  **/.expo/**,\
  RehniMarket-mobile/android/**,\
  RehniMarket-mobile/ios/**,\
  RehniMarket-backend/alembic/versions/**,\
  RehniMarket-backend/tests/**,\
  **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx