# =============================================================================
# SonarQube Cloud (SonarCloud) — análisis del monorepo Rehni-Market
# Lo lee SonarSource/sonarqube-scan-action desde la raíz del repo
# (.github/workflows/sonarcloud.yml). Todas las rutas son relativas a la raíz.
# =============================================================================

# Identidad del proyecto. La clave de la organización es la que muestra
# SonarCloud (en minúsculas), no el nombre visible de la cuenta de GitHub.
sonar.organization=rehnieyal
sonar.projectKey=RehnieyAl_Rehni-Market
sonar.projectName=Rehni-Market
sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# Código fuente (lo que se mide: bugs, code smells, duplicación, cobertura)
# Solo el código de la aplicación de cada paquete. Así quedan fuera sin más
# esfuerzo alembic/, scripts/, docs/, deploy/ y el .pnpm-store versionado.
# -----------------------------------------------------------------------------
sonar.sources=\
  RehniMarket-backend/app,\
  RehniMarket-frontend/src,\
  RehniMarket-mobile/src,\
  RehniMarket-mobile/App.tsx,\
  RehniMarket-mobile/index.ts

# -----------------------------------------------------------------------------
# Pruebas (Sonar las reconoce como tests: no cuentan como código fuente ni
# para duplicación/cobertura, y sus issues usan reglas de test).
# El frontend tiene las pruebas junto al código (src/**/*.test.tsx), por eso
# src aparece en sources y en tests, y se separa con inclusions/exclusions.
# -----------------------------------------------------------------------------
sonar.tests=\
  RehniMarket-backend/tests,\
  RehniMarket-frontend/src
sonar.test.inclusions=\
  RehniMarket-backend/tests/**,\
  RehniMarket-frontend/src/**/*.test.ts,\
  RehniMarket-frontend/src/**/*.test.tsx,\
  RehniMarket-frontend/src/test/**

# Excluido del código fuente: los tests del frontend (para que no estén en
# sources y tests a la vez), dependencias, builds y artefactos generados.
sonar.exclusions=\
  RehniMarket-frontend/src/**/*.test.ts,\
  RehniMarket-frontend/src/**/*.test.tsx,\
  RehniMarket-frontend/src/test/**,\
  **/node_modules/**,\
  **/.pnpm-store/**,\
  **/dist/**,\
  **/build/**,\
  **/.expo/**,\
  **/__pycache__/**,\
  **/coverage/**,\
  **/htmlcov/**,\
  **/alembic/versions/**,\
  **/*.d.ts

# -----------------------------------------------------------------------------
# Cobertura
# -----------------------------------------------------------------------------
# Mismas exclusiones que vitest.config.ts (sin lógica ejecutable), para que el
# porcentaje de Sonar y el de CI cuadren. Mobile aún no tiene pruebas ni runner
# en CI: se analiza (bugs, smells, seguridad) pero no se mide su cobertura,
# porque sería un 0 % que no viene de una medición sino de no medir.
# Quitar RehniMarket-mobile/** de aquí cuando mobile tenga tests en CI.
sonar.coverage.exclusions=\
  RehniMarket-frontend/src/main.tsx,\
  RehniMarket-frontend/src/features/**/types/**,\
  RehniMarket-mobile/**

# Python: versión de RehniMarket-backend/Dockerfile y pyproject (>=3.13).
sonar.python.version=3.13
# XML de pytest-cov (coverage.py). Sus rutas son absolutas al workspace del
# runner, por eso coinciden con sources sin reescribirlas.
sonar.python.coverage.reportPaths=RehniMarket-backend/coverage.xml

# JS/TS: lcov de Vitest. El workflow antepone "RehniMarket-frontend/" a las
# rutas SF: (Vitest las escribe relativas a RehniMarket-frontend/).
sonar.javascript.lcov.reportPaths=RehniMarket-frontend/coverage/lcov.info
